services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: walk
      POSTGRES_PASSWORD: walk # local only
      POSTGRES_DB: walk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walk -d walk"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ENV: local
      DATABASE_URL: postgresql+psycopg://walk:walk@db:5432/walk
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
