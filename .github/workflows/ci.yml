name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # never cancel a deploy halfway

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: walk
          POSTGRES_PASSWORD: walk
          POSTGRES_DB: walk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U walk -d walk"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://walk:walk@localhost:5432/walk
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Static checks only — no GCP credentials. `terraform apply` runs locally (docs/deploy/cloud-run.md).
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    needs: [test, terraform]
    # Skips (instead of failing) until the repo variables from `terraform output github_variables` are set.
    if: github.ref == 'refs/heads/main' && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    env:
      IMAGE: ${{ vars.IMAGE_REPO }}/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

      # Migrate first with the new image; if it fails, the old revision keeps serving.
      - name: Run database migrations
        run: |
          gcloud run jobs update "${{ vars.MIGRATE_JOB }}" --region "${{ vars.GCP_REGION }}" --image "$IMAGE" --quiet
          gcloud run jobs execute "${{ vars.MIGRATE_JOB }}" --region "${{ vars.GCP_REGION }}" --wait

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          skip_default_labels: true # keep labels Terraform-owned (no drift)

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.url }}"
          body=$(curl -fsS --retry 5 --retry-delay 3 "$url/health")
          echo "$body"
          echo "$body" | grep -q '"version":"${{ github.sha }}"'
          curl -fsS "$url/api/v1/home" > /dev/null
          # No token must give 401: 503 = DATABASE_URL not wired, 200 = auth disabled.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url/api/v1/me/profile")
          echo "/me/profile without token -> $code"
          test "$code" = "401"
